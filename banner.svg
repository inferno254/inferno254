<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Erick Neko — Inferno</title>
  <desc id="desc">Animated green flame banner: My bugs are features. My features are startups. Flutter, Solidity, Nairobi Kenya.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030806"/>
      <stop offset=".55" stop-color="#06120b"/>
      <stop offset="1" stop-color="#082016"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="rgba(6,78,59,0)"/>
      <stop offset=".35" stop-color="rgba(16,185,129,.09)"/>
      <stop offset=".7" stop-color="rgba(74,222,128,.05)"/>
      <stop offset="1" stop-color="rgba(220,252,231,.02)"/>
    </linearGradient>
    <linearGradient id="flameA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset=".3" stop-color="#059669"/>
      <stop offset=".62" stop-color="#22c55e"/>
      <stop offset=".85" stop-color="#86efac"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="flameB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset=".32" stop-color="#10b981"/>
      <stop offset=".65" stop-color="#4ade80"/>
      <stop offset=".88" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="flameC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset=".4" stop-color="#14b8a6"/>
      <stop offset=".75" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset=".25" stop-color="#bbf7d0"/>
      <stop offset=".55" stop-color="#4ade80"/>
      <stop offset=".82" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b2"/>
      <feMerge>
        <feMergeNode in="b2" opacity=".34"/>
        <feMergeNode in="b1" opacity=".6"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fireGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 .25 0 0 0  .2 .9 .25 0 0  0 .35 .15 0 0  0 0 0 1 0" result="cg"/>
      <feMerge><feMergeNode in="cg" opacity=".65"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="980" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .bg { fill: url(#sky); }
    .frame { fill:none; stroke: rgba(74,222,128,.22); stroke-width:1.2; }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; }
    .f1 { animation: lick1 1.25s ease-in-out infinite alternate; }
    .f2 { animation: lick2 1.55s ease-in-out infinite alternate; }
    .f3 { animation: lick3 1.05s ease-in-out infinite alternate; }
    @keyframes lick1 { 0%{transform:scaleX(.94) scaleY(.82) skewX(-3deg)} 50%{transform:scaleX(1.05) scaleY(1.1) skewX(2deg)} 100%{transform:scaleX(.98) scaleY(.9) skewX(-1deg)} }
    @keyframes lick2 { 0%{transform:scaleX(1.03) scaleY(.86) skewX(2deg)} 50%{transform:scaleX(.92) scaleY(1.12) skewX(-3deg)} 100%{transform:scaleX(1.01) scaleY(.92) skewX(1deg)} }
    @keyframes lick3 { 0%{transform:scaleX(.97) scaleY(.9) skewX(-2deg)} 100%{transform:scaleX(1.06) scaleY(1.05) skewX(2deg)} }
    .title { font: 900 104px Impact, "Arial Black", "Segoe UI Black", system-ui, sans-serif; letter-spacing: 5px; fill: url(#titleFill); }
    .glitch { animation: glitch 6.5s steps(1) infinite; fill:#22c55e; opacity:0; }
    @keyframes glitch { 0%,91%,100%{opacity:0;transform:translate(0,0)} 92%{opacity:.55;transform:translate(-5px,1px)} 93%{opacity:.4;transform:translate(5px,-1px)} 94%{opacity:.25;transform:translate(-2px,0)} 95%{opacity:0} }
    .bio1, .bio2, .bio3 { font-family: "JetBrains Mono","Cascadia Code","Fira Code","Courier New",monospace; text-anchor: middle; }
    .bio1 { font-size: 20px; fill: #f0fdf4; letter-spacing: .5px; }
    .bio2 { font-size: 18px; fill: #bbf7d0; letter-spacing: .4px; }
    .bio3 { font-size: 15px; fill: #86efac; letter-spacing: 1.2px; }
    .reveal1 { opacity:0; animation: reveal 8s ease forwards; }
    .reveal2 { opacity:0; animation: reveal 8s ease .45s forwards; }
    .reveal3 { opacity:0; animation: reveal 8s ease .9s forwards; }
    @keyframes reveal { 0%{opacity:0;transform:translateY(6px)} 12%{opacity:1;transform:translateY(0)} 100%{opacity:1;transform:translateY(0)} }
    .cursor { animation: blink 1s steps(1) infinite; fill:#4ade80; }
    @keyframes blink { 50%{opacity:0} }
    .spark { fill:url(#ember); opacity:0; }
  </style>

  <g clip-path="url(#clip)">
    <rect class="bg" x="0" y="0" width="980" height="320"/>
    <rect fill="url(#heat)" x="0" y="120" width="980" height="200"/>

    <!-- small flame bed: kept low so text stays clear -->
    <g opacity=".36" filter="url(#fireGlow)">
      <path class="flame f2" fill="url(#flameA)" d="M30,320 C40,298 52,292 60,276 C68,292 80,298 90,320 Z" style="animation-delay:-.2s"/>
      <path class="flame f1" fill="url(#flameB)" d="M110,320 C122,295 136,288 146,268 C156,288 170,295 182,320 Z" style="animation-delay:-.9s"/>
      <path class="flame f3" fill="url(#flameC)" d="M200,320 C212,296 226,290 236,272 C246,290 260,296 272,320 Z" style="animation-delay:-.4s"/>
      <path class="flame f2" fill="url(#flameA)" d="M290,320 C302,297 316,291 326,274 C336,291 350,297 362,320 Z" style="animation-delay:-1.1s"/>
      <path class="flame f1" fill="url(#flameB)" d="M380,320 C392,298 406,292 416,276 C426,292 440,298 452,320 Z" style="animation-delay:-.5s"/>
      <path class="flame f3" fill="url(#flameC)" d="M470,320 C482,296 496,290 506,272 C516,290 530,296 542,320 Z" style="animation-delay:-.7s"/>
      <path class="flame f2" fill="url(#flameA)" d="M560,320 C572,297 586,291 596,274 C606,291 620,297 632,320 Z" style="animation-delay:-.3s"/>
      <path class="flame f1" fill="url(#flameB)" d="M650,320 C662,298 676,292 686,276 C696,292 710,298 722,320 Z" style="animation-delay:-1.0s"/>
      <path class="flame f3" fill="url(#flameC)" d="M740,320 C752,295 766,288 776,268 C786,288 800,295 812,320 Z" style="animation-delay:-.6s"/>
      <path class="flame f2" fill="url(#flameA)" d="M830,320 C842,296 856,290 866,272 C876,290 890,296 902,320 Z" style="animation-delay:-.85s"/>
      <path class="flame f1" fill="url(#flameB)" d="M915,320 C926,299 938,293 946,278 C954,293 966,299 978,320 Z" style="animation-delay:-.25s"/>
    </g>

    <g opacity=".58">
      <path class="flame f1" fill="url(#flameB)" d="M-5,320 C8,302 20,297 28,284 C36,297 48,302 61,320 Z"/>
      <path class="flame f3" fill="url(#flameA)" d="M55,320 C68,300 82,294 92,279 C102,294 116,300 129,320 Z" style="animation-delay:-.3s"/>
      <path class="flame f2" fill="url(#flameC)" d="M123,320 C136,301 150,295 160,281 C170,295 184,301 197,320 Z" style="animation-delay:-.8s"/>
      <path class="flame f1" fill="url(#flameB)" d="M191,320 C204,302 218,296 228,283 C238,296 252,302 265,320 Z" style="animation-delay:-.15s"/>
      <path class="flame f3" fill="url(#flameA)" d="M259,320 C272,300 286,294 296,280 C306,294 320,300 333,320 Z" style="animation-delay:-.55s"/>
      <path class="flame f2" fill="url(#flameC)" d="M327,320 C340,301 354,295 364,282 C374,295 388,301 401,320 Z" style="animation-delay:-.95s"/>
      <path class="flame f1" fill="url(#flameB)" d="M395,320 C408,302 422,296 432,283 C442,296 456,302 469,320 Z" style="animation-delay:-.25s"/>
      <path class="flame f3" fill="url(#flameA)" d="M463,320 C476,300 490,294 500,280 C510,294 524,300 537,320 Z" style="animation-delay:-.65s"/>
      <path class="flame f2" fill="url(#flameC)" d="M531,320 C544,301 558,295 568,282 C578,295 592,301 605,320 Z" style="animation-delay:-.45s"/>
      <path class="flame f1" fill="url(#flameB)" d="M599,320 C612,302 626,296 636,283 C646,296 660,302 673,320 Z" style="animation-delay:-.75s"/>
      <path class="flame f3" fill="url(#flameA)" d="M667,320 C680,300 694,294 704,279 C714,294 728,300 741,320 Z" style="animation-delay:-.35s"/>
      <path class="flame f2" fill="url(#flameC)" d="M735,320 C748,301 762,295 772,281 C782,295 796,301 809,320 Z" style="animation-delay:-1.05s"/>
      <path class="flame f1" fill="url(#flameB)" d="M803,320 C816,302 830,296 840,283 C850,296 864,302 877,320 Z" style="animation-delay:-.5s"/>
      <path class="flame f3" fill="url(#flameA)" d="M871,320 C884,300 898,294 908,280 C918,294 932,300 945,320 Z" style="animation-delay:-.9s"/>
      <path class="flame f2" fill="url(#flameC)" d="M939,320 C950,302 960,297 968,285 C976,297 986,302 997,320 Z" style="animation-delay:-.2s"/>
    </g>

    <!-- embers (SMIL) -->
    <g>
      <circle class="spark" cx="90" cy="305" r="1.8"><animate attributeName="cy" from="305" to="235" dur="4.8s" begin="0s" repeatCount="indefinite"/><animate attributeName="cx" values="90;98;84;94;90" dur="4.8s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.82;.52;0" dur="4.8s" begin="0s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="220" cy="308" r="1.4"><animate attributeName="cy" from="308" to="245" dur="5.2s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="cx" values="220;212;226;218;220" dur="5.2s" begin="-1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.78;.48;0" dur="5.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="380" cy="304" r="2.1"><animate attributeName="cy" from="304" to="228" dur="5.0s" begin="-2.3s" repeatCount="indefinite"/><animate attributeName="cx" values="380;394;372;386;380" dur="5.0s" begin="-2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.86;.56;0" dur="5.0s" begin="-2.3s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="540" cy="307" r="1.6"><animate attributeName="cy" from="307" to="238" dur="5.4s" begin="-3.0s" repeatCount="indefinite"/><animate attributeName="cx" values="540;530;548;536;540" dur="5.4s" begin="-3.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;.48;0" dur="5.4s" begin="-3.0s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="700" cy="305" r="1.9"><animate attributeName="cy" from="305" to="232" dur="4.7s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="cx" values="700;712;694;706;700" dur="4.7s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.84;.52;0" dur="4.7s" begin="-0.7s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="860" cy="308" r="1.5"><animate attributeName="cy" from="308" to="242" dur="5.6s" begin="-3.8s" repeatCount="indefinite"/><animate attributeName="cx" values="860;852;866;856;860" dur="5.6s" begin="-3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.78;.46;0" dur="5.6s" begin="-3.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- title -->
    <g filter="url(#softGlow)">
      <text class="title" x="490" y="132" text-anchor="middle">INFERNO</text>
      <text class="title glitch" x="490" y="132" text-anchor="middle">INFERNO</text>
    </g>

    <!-- bio (incorporated) -->
    <g>
      <text class="bio1 reveal1" x="490" y="182">My bugs are features. My features are startups.</text>
      <text class="bio2 reveal2" x="490" y="214">Flutter · Solidity · Too much coffee ☕</text>
      <text class="bio3 reveal3" x="490" y="244">Nairobi, Kenya · inferno-ke.vercel.app<tspan class="cursor"> ▌</tspan></text>
    </g>

    <rect class="frame" x="1" y="1" width="978" height="318" rx="18"/>
  </g>
</svg>
