<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Erick Neko — Inferno</title>
  <desc id="desc">Animated flame banner: My bugs are features. My features are startups. Flutter, Solidity, Nairobi Kenya.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050407"/>
      <stop offset=".55" stop-color="#12090b"/>
      <stop offset="1" stop-color="#2a0d06"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="rgba(122,29,12,0)"/>
      <stop offset=".35" stop-color="rgba(255,90,42,.16)"/>
      <stop offset=".7" stop-color="rgba(255,179,71,.10)"/>
      <stop offset="1" stop-color="rgba(255,240,200,.03)"/>
    </linearGradient>
    <linearGradient id="flameA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5a1208"/>
      <stop offset=".35" stop-color="#ff3d12"/>
      <stop offset=".7" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#fff1bf"/>
    </linearGradient>
    <linearGradient id="flameB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a1d0c"/>
      <stop offset=".4" stop-color="#ff5a2a"/>
      <stop offset=".78" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffe8a8"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset=".28" stop-color="#ffd27a"/>
      <stop offset=".58" stop-color="#ff7a2a"/>
      <stop offset="1" stop-color="#c43a10"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1bf"/>
      <stop offset="1" stop-color="#ff6a1f"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="b2"/>
      <feMerge>
        <feMergeNode in="b2" opacity=".45"/>
        <feMergeNode in="b1" opacity=".75"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fireGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="g"/>
      <feColorMatrix in="g" type="matrix" values="1 0 0 0 0  0 .55 0 0 0  0 0 .12 0 0  0 0 0 1 0" result="cg"/>
      <feMerge><feMergeNode in="cg"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="980" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .bg { fill: url(#sky); }
    .frame { fill:none; stroke: rgba(255,179,71,.18); stroke-width:1.2; }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; }
    .f1 { animation: lick1 1.15s ease-in-out infinite alternate; }
    .f2 { animation: lick2 1.45s ease-in-out infinite alternate; }
    .f3 { animation: lick3 .95s ease-in-out infinite alternate; }
    @keyframes lick1 { 0%{transform:scaleX(.92) scaleY(.78) skewX(-4deg)} 50%{transform:scaleX(1.06) scaleY(1.12) skewX(3deg)} 100%{transform:scaleX(.98) scaleY(.88) skewX(-2deg)} }
    @keyframes lick2 { 0%{transform:scaleX(1.04) scaleY(.84) skewX(3deg)} 50%{transform:scaleX(.9) scaleY(1.16) skewX(-4deg)} 100%{transform:scaleX(1.02) scaleY(.92) skewX(2deg)} }
    @keyframes lick3 { 0%{transform:scaleX(.96) scaleY(.9) skewX(-2deg)} 100%{transform:scaleX(1.08) scaleY(1.06) skewX(3deg)} }
    .title { font: 900 104px Impact, "Arial Black", "Segoe UI Black", system-ui, sans-serif; letter-spacing: 5px; fill: url(#titleFill); }
    .titleGlow { opacity:.55; filter:url(#softGlow); }
    .glitch { animation: glitch 6.5s steps(1) infinite; fill:#ff5a2a; opacity:0; }
    @keyframes glitch { 0%,91%,100%{opacity:0;transform:translate(0,0)} 92%{opacity:.65;transform:translate(-5px,1px)} 93%{opacity:.5;transform:translate(5px,-1px)} 94%{opacity:.35;transform:translate(-2px,0)} 95%{opacity:0} }
    .bio1, .bio2, .bio3 { font-family: "JetBrains Mono","Cascadia Code","Fira Code","Courier New",monospace; text-anchor: middle; }
    .bio1 { font-size: 20px; fill: #f3ece2; letter-spacing: .5px; }
    .bio2 { font-size: 18px; fill: #ffcf8a; letter-spacing: .4px; }
    .bio3 { font-size: 15px; fill: #b9a89a; letter-spacing: 1.2px; }
    .reveal1 { opacity:0; animation: reveal 8s ease forwards; }
    .reveal2 { opacity:0; animation: reveal 8s ease .45s forwards; }
    .reveal3 { opacity:0; animation: reveal 8s ease .9s forwards; }
    @keyframes reveal { 0%{opacity:0;transform:translateY(6px)} 12%{opacity:1;transform:translateY(0)} 100%{opacity:1;transform:translateY(0)} }
    .cursor { animation: blink 1s steps(1) infinite; fill:#ff7a2a; }
    @keyframes blink { 50%{opacity:0} }
    .spark { fill:url(#ember); opacity:0; }
  </style>

  <g clip-path="url(#clip)">
    <rect class="bg" x="0" y="0" width="980" height="320"/>
    <rect fill="url(#heat)" x="0" y="70" width="980" height="250"/>

    <!-- back flames -->
    <g opacity=".55" filter="url(#fireGlow)">
      <path class="flame f2" fill="url(#flameA)" d="M20,320 C35,250 55,230 70,170 C88,228 110,245 125,320 Z" style="animation-delay:-.2s"/>
      <path class="flame f1" fill="url(#flameB)" d="M95,320 C112,238 138,210 160,138 C182,212 210,238 228,320 Z" style="animation-delay:-.9s"/>
      <path class="flame f3" fill="url(#flameA)" d="M200,320 C218,252 242,228 262,165 C282,228 306,250 326,320 Z" style="animation-delay:-.4s"/>
      <path class="flame f2" fill="url(#flameB)" d="M620,320 C640,248 666,222 688,158 C710,224 736,246 756,320 Z" style="animation-delay:-1.1s"/>
      <path class="flame f1" fill="url(#flameA)" d="M730,320 C748,236 774,206 796,132 C818,208 844,236 862,320 Z" style="animation-delay:-.5s"/>
      <path class="flame f3" fill="url(#flameB)" d="M835,320 C852,252 874,232 892,175 C910,232 932,250 960,320 Z" style="animation-delay:-.7s"/>
    </g>

    <!-- front flame bed -->
    <g opacity=".92">
      <path class="flame f1" fill="url(#flameB)" d="M-10,320 C15,265 35,255 48,210 C62,255 82,265 108,320 Z"/>
      <path class="flame f3" fill="url(#flameA)" d="M82,320 C105,258 128,244 146,188 C164,244 188,258 210,320 Z" style="animation-delay:-.3s"/>
      <path class="flame f2" fill="url(#flameB)" d="M185,320 C206,262 228,250 245,198 C262,250 284,262 305,320 Z" style="animation-delay:-.8s"/>
      <path class="flame f1" fill="url(#flameA)" d="M282,320 C302,268 322,256 338,208 C354,256 374,268 394,320 Z" style="animation-delay:-.15s"/>
      <path class="flame f3" fill="url(#flameB)" d="M372,320 C392,266 412,254 428,205 C444,254 464,266 484,320 Z" style="animation-delay:-.55s"/>
      <path class="flame f2" fill="url(#flameA)" d="M462,320 C482,266 502,254 518,205 C534,254 554,266 574,320 Z" style="animation-delay:-.95s"/>
      <path class="flame f1" fill="url(#flameB)" d="M552,320 C572,268 592,256 608,208 C624,256 644,268 664,320 Z" style="animation-delay:-.25s"/>
      <path class="flame f3" fill="url(#flameA)" d="M642,320 C662,262 684,250 701,198 C718,250 740,262 760,320 Z" style="animation-delay:-.65s"/>
      <path class="flame f2" fill="url(#flameB)" d="M738,320 C760,258 784,244 802,188 C820,244 844,258 866,320 Z" style="animation-delay:-.45s"/>
      <path class="flame f1" fill="url(#flameA)" d="M845,320 C868,265 888,255 901,210 C915,255 935,265 990,320 Z" style="animation-delay:-.75s"/>
    </g>

    <!-- embers (SMIL for GitHub img/SVG) -->
    <g>
      <circle class="spark" cx="120" cy="275" r="2.2"><animate attributeName="cy" from="275" to="70" dur="4.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="cx" values="120;132;114;126;120" dur="4.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;.75;0" dur="4.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="r" values="1.2;2.4;1.1" dur="4.6s" begin="0s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="240" cy="285" r="1.6"><animate attributeName="cy" from="285" to="95" dur="5.4s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="cx" values="240;228;248;236;240" dur="5.4s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.6;0" dur="5.4s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="410" cy="280" r="2.8"><animate attributeName="cy" from="280" to="52" dur="5.9s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="cx" values="410;430;398;422;410" dur="5.9s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;.7;0" dur="5.9s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="r" values="1.4;3;1.2" dur="5.9s" begin="-2.4s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="560" cy="282" r="1.9"><animate attributeName="cy" from="282" to="64" dur="5.1s" begin="-3.1s" repeatCount="indefinite"/><animate attributeName="cx" values="560;548;572;554;560" dur="5.1s" begin="-3.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;.65;0" dur="5.1s" begin="-3.1s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="700" cy="278" r="2.4"><animate attributeName="cy" from="278" to="78" dur="4.9s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="cx" values="700;716;692;708;700" dur="4.9s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;.7;0" dur="4.9s" begin="-0.8s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="845" cy="284" r="1.7"><animate attributeName="cy" from="284" to="88" dur="5.6s" begin="-4s" repeatCount="indefinite"/><animate attributeName="cx" values="845;832;854;840;845" dur="5.6s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;.55;0" dur="5.6s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle class="spark" cx="330" cy="290" r="1.4"><animate attributeName="cy" from="290" to="110" dur="6.2s" begin="-2s" repeatCount="indefinite"/><animate attributeName="cx" values="330;340;322;334;330" dur="6.2s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.5;0" dur="6.2s" begin="-2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- title -->
    <g filter="url(#fireGlow)">
      <text class="title titleGlow" x="490" y="132" text-anchor="middle">INFERNO</text>
      <text class="title" x="490" y="132" text-anchor="middle">INFERNO</text>
      <text class="title glitch" x="490" y="132" text-anchor="middle">INFERNO</text>
    </g>

    <!-- bio (incorporated) -->
    <g>
      <text class="bio1 reveal1" x="490" y="182">My bugs are features. My features are startups.</text>
      <text class="bio2 reveal2" x="490" y="214">Flutter · Solidity · Too much coffee ☕</text>
      <text class="bio3 reveal3" x="490" y="244">Nairobi, Kenya · inferno-ke.vercel.app<tspan class="cursor"> ▌</tspan></text>
    </g>

    <rect class="frame" x="1" y="1" width="978" height="318" rx="18"/>
  </g>
</svg>
